[project]
name = "Proyecto-3-CPD"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "~=3.12.0"
authors = [{ name = "Calvoloncio", email = "xavichavochavuski@gmail.com" }]
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.uv.build-backend]
module-root = "."
module-name = "proyecto_3_cpd"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["proyecto_3_cpd", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
